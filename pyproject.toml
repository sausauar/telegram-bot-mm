[project]
name = "telegram-bot-mm"
version = "0.1.0"
description = "Telegram AI assistant with a guarded RAG pipeline for Centr Krasok."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1",
    "httpx>=0.27,<1",
    "openai>=1.58,<2",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = true
